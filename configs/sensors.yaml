# configs/sensors.yaml
# Single source of truth for sensor configuration.
# The ESP32 firmware (src/inference/src/main.cpp) and Python preprocessing
# (src/training/preprocess.py, Phase 2) MUST stay consistent with this file.

sampling:
  target_hz: 50                # Loop rate (delay(20) in firmware)
  window_samples: 500          # 10 s @ 50 Hz (used in Phase 2)
  rpm_window_ms: 1000          # RPM computed over 1 s

channels:
  # Order is CRITICAL. Model expects inputs in this order.
  - name: ax
    unit: m_s2
    source: mpu6050
  - name: ay
    unit: m_s2
    source: mpu6050
  - name: az
    unit: m_s2
    source: mpu6050
  - name: current_a
    unit: A
    source: acs712
  - name: voltage_v
    unit: V
    source: divider
  - name: rpm
    unit: rpm
    source: ir

labels:
  - healthy
  - imbalanced
  - friction

mpu6050:
  accel_range_g: 8
  filter_bandwidth_hz: 21

acs712:
  # CALIBRATE ON YOUR HARDWARE — see docs/wiring.md §4.
  supply_v: 3.3               # ACS712 VCC (3.3V recommended for ESP32-C3)
  zero_v: 1.65                # Raw output at zero current (VCC/2)
  sensitivity_v_per_a: 0.066  # ACS712-30A = 0.066; 20A = 0.100; 5A = 0.185

voltage_divider:
  r1_ohm: 100000
  r2_ohm: 20000
  adc_cal_factor: 0.9307     # <-- ADD THIS LINE

adc:
  resolution_bits: 12
  reference_v: 3.3
  attenuation: 11db           # ADC_11db → full 0-3.3V range