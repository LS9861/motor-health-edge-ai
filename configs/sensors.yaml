# configs/sensors.yaml

sampling:
  target_hz: 50
  window_samples: 50
  step_samples: 25
  rpm_window_ms: 1000

features:
  # 5 real sensor channels
  time_series:
    - ax
    - ay
    - az
    - current_mA
    - voltage_v
  
  # NEW — v3 uses a 6th channel built from mean_rpm.
  # Set this to true so preprocess.py appends the mean_rpm column
  # (repeated 100 times) as a 6th channel to every window.
  rpm_as_channel: true

channels:
  - name: ax
    unit: m_s2
    source: mpu6050
  - name: ay
    unit: m_s2
    source: mpu6050
  - name: az
    unit: m_s2
    source: mpu6050
  - name: current_mA
    unit: mA
    source: ina228
  - name: voltage_v
    unit: V
    source: ina228
  - name: rpm
    unit: rpm
    source: ir

labels:
  - healthy
  - imbalanced
  - friction

mpu6500:
  accel_range_g: 8
  filter_bandwidth_hz: 21

ina228:
  i2c_address: 0x40
  shunt_ohm: 0.015
  max_current_a: 3.0