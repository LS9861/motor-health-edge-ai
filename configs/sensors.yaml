# configs/sensors.yaml
# Single source of truth for sensor configuration.
# Firmware and Python preprocessing must stay consistent with this file.

sampling:
  target_hz: 50
  window_samples: 100
  step_samples: 50
  rpm_window_ms: 1000

# Feature selection lives here so we can edit YAML instead of code.
# RPM is intentionally NOT in time_series (see docs/phase1_bringup.md).
# It will return in Phase 4 as scalar `mean_rpm` and Phase 5 as 50Hz time series.
features:
  time_series:
    - ax
    - ay
    - az
    - current_mA
    - voltage_v
  # scalar_features:            # Phase 4 — will add mean_rpm
  #   - mean_rpm

channels:
  - name: ax
    unit: m_s2
    source: mpu6050
  - name: ay
    unit: m_s2
    source: mpu6050
  - name: az
    unit: m_s2
    source: mpu6050
  - name: current_mA
    unit: mA
    source: ina228
  - name: voltage_v
    unit: V
    source: ina228
  - name: rpm
    unit: rpm
    source: ir
    note: "1 Hz in firmware; dropped from Phase 3 features."

labels:
  - healthy
  - imbalanced
  - friction

mpu6500:
  accel_range_g: 8
  filter_bandwidth_hz: 21

ina228:
  i2c_address: 0x40
  shunt_ohm: 0.015
  max_current_a: 3.0