# configs/sensors.yaml
# Single source of truth for sensor configuration.
# Firmware (src/inference/src/main.cpp) and Python preprocessing must
# stay consistent with this file.
#
# Last updated: Phase 1, Step 3 (INA228 integration)

sampling:
  target_hz: 50                # Loop rate (delay(20) in firmware)
  window_samples: 500          # 10 s @ 50 Hz (used in Phase 2)
  rpm_window_ms: 1000          # RPM computed over 1 s

channels:
  # Order is CRITICAL. Model expects inputs in this order.
  - name: ax
    unit: m_s2
    source: mpu6050
  - name: ay
    unit: m_s2
    source: mpu6050
  - name: az
    unit: m_s2
    source: mpu6050
  - name: current_a
    unit: A
    source: ina228          # <-- CHANGED (was: acs712)
  - name: voltage_v
    unit: V
    source: ina228          # <-- CHANGED (was: divider)
  - name: rpm
    unit: rpm
    source: ir

labels:
  - healthy
  - imbalanced
  - friction

mpu6050:
  accel_range_g: 8
  filter_bandwidth_hz: 21

# <-- REPLACED block: acs712 + voltage_divider → ina228
ina228:
  i2c_address: 0x40
  shunt_resistance_ohm: 0.015    # Adafruit breakout PID 5832 (fixed hardware)
  max_expected_current_a: 3.0
  averaging_count: 16
  zero_baseline_ma: -0.36        # measured with motor off (Step 3)
  measurement_mode: high_side    # VBUS jumper closed
  logic_supply_v: 3.3

ir:
  pulses_per_rev: 1
  pin: 10
  pullup: true

adc:
  resolution_bits: 12
  reference_v: 3.3
  attenuation: 11db           # only used for any remaining analog channels