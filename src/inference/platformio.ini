[env:esp32-c3-supermini]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; USB CDC serial for the C3 SuperMini
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; Optional: keep firmware .bin artifacts out of the repo
; (covered by root .gitignore via .pio/ as well)