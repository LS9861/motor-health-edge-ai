; src/inference/platformio.ini
; PlatformIO config for ESP32-C3 SuperMini motor data logger.
; Step 3: INA228 current/voltage sensor added (I2C, shared bus with MPU6050).

[env:esp32-c3-supermini]
platform        = espressif32
board           = esp32-c3-devkitm-1       ; closest board def for ESP32-C3 SuperMini
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = time, colorize

; ESP32-C3 SuperMini uses native USB-CDC.
; Without these two flags, Serial.println() does NOT reach the PC Monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries
; - MPU6050: added in Step 4 (vibration) — keep the entry ready
; - INA228 : added in Step 3 (current + voltage)
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    https://github.com/adafruit/Adafruit_INA228.git